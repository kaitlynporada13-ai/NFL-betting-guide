# Strategy notes
strategy:
  primary_angle: "OVER on receiving/rushing props when line is at or below rolling average"
  best_positions: ["WR", "TE", "RB"]
  avoid: "QBs (guaranteed money regardless), aging players over 32 (body breaks down)"
  combine_with:
    - "Dome games (contract year + dome = double OVER signal)"
    - "Weeks 13+ (contract year + playoff push = maximum motivation)"
    - "Non-division games (less familiarity = exploit individual talent)"
  caution:
    - "Don't override strong UNDER signals (Week 1, new team, high injury)"
    - "Contract year is a TIEBREAKER or BOOST, not a standalone bet"
    - "Watch for holdout/trade request players (may not give full effort)"
