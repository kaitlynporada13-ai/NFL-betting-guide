# 2026 Contract Year Players
# Players in the final year of their deal (UFA after 2026 season)
# Source: Spotrac roster data + public reporting
# Hypothesis: Contract year players outperform their lines (motivation effect)
# ============================================================================
#
# Betting angle: These players have financial incentive to perform.
# Research suggests ~2-3% over-rate improvement in contract years.
# Most useful for: OVER bets when line is at or below rolling average.
# Position priority: WR/TE/RB (stats directly = $$$), less so for QB (guaranteed $)
#
# Updated: 2026-08-07

