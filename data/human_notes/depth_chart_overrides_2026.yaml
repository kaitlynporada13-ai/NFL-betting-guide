# Players whose role SHRANK (baseline overstates -> under even stronger)
role_down: []

notes:
  - "This is CURRENT-INFORMATION judgment, not a backtested pattern."
  - "Week 1 validation found NO historical over edge — but injury-driven volume is"
  - "a legitimate real-time exception the historical data cannot see."
  - "For role_up players: DO NOT bet the under off a stale-low baseline. The line is"
  - "high for a reason. If anything they are over-risk; bet unders elsewhere."
