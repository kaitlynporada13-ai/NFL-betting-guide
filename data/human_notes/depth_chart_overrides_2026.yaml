# Depth-chart / role-change overrides for the projection engine.
# When a starter is injured, the player behind them gets a bigger role.
# Their prior-season baseline UNDERSTATES their new usage, so:
#   - the "inflated line -> under" signal is FALSE (line is high because role grew)
#   - they may instead be an OVER candidate (volume boost the market just priced in)
# The engine flags these as ROLE-CHANGE: do not trust the under; lean over-risk.
#
# Keep this updated weekly as injuries develop. Format:
#   role_up:  players whose usage increased (someone ahead is hurt)
#   role_down: players whose usage decreased (rare; makes under stronger)
# ============================================================================

updated: "2026-08-25"

