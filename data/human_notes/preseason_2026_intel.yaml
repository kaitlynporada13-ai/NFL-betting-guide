# 2026 Preseason Intelligence
# Sources: ESPN Newcomers Impact Rankings, Sharp Football SOS, Spotrac, public reporting
# Updated: 2026-08-07
# ============================================================

season: 2026

# Strength of Schedule (1 = easiest, 32 = hardest)
# Based on Vegas Forecasted Win Totals (Sharp Football Analysis)
strength_of_schedule:
  easiest_5:
    - DET  # 1 - Lions
    - CIN  # 2 - Bengals
    - NO   # 3 - Saints
    - NYJ  # 4 - Jets
    - HOU  # 5 - Texans
  hardest_5:
    - ARI  # 32 - Cardinals (hardest)
    - MIA  # 31 - Dolphins
    - CAR  # 30 - Panthers
    - WAS  # 29 - Commanders
    - DAL  # 28 - Cowboys

# Key player movement (new team → affects early season props)
# Per our confirmed finding: New team + weeks 1-4 → UNDER hits at 55.2%
new_team_players:
  # WRs on new teams (high prop impact)
  - player: "A.J. Brown"
    new_team: NE
    old_team: PHI
    position: WR
    notes: |
      True WR1. Had 1000+ yards 4 straight seasons in PHI.
      New QB (Drake Maye). Building chemistry takes time.
      Week 1-4 receiving yards/receptions: LEAN UNDER.
    props_affected:
      - receiving_yards: under_early
      - receptions: under_early

  - player: "DJ Moore"
    new_team: BUF
    old_team: CHI
    position: WR
    notes: |
      Explosive with catch-and-run skills. Josh Allen connection.
      "Should see over 100 targets" per ESPN. But new system = adjustment.
      Week 1-4: LEAN UNDER. Mid-season: could be OVER candidate.
    props_affected:
      - receiving_yards: under_early_over_late
      - receptions: under_early_over_late

  - player: "Jaylen Waddle"
    new_team: DEN
    old_team: MIA
    position: WR
    notes: |
      Speed threat but now with Bo Nix (less arm talent than Tua).
      Denver has Sutton already. Target share will be split.
      Strong UNDER candidate weeks 1-6.
    props_affected:
      - receiving_yards: under

  - player: "Mike Evans"
    new_team: SF
    old_team: TB
    position: WR
    notes: |
      11 consecutive 1000-yard seasons. Now in Shanahan system.
      Play-action heavy = deep shots. But injuries limited 2025.
      Age 33. New system. Lean UNDER early, reassess by week 5.
    props_affected:
      - receiving_yards: under_early

  - player: "Makai Lemon"
    new_team: PHI
    old_team: "Rookie (USC)"
    position: WR
    notes: |
      Replaces A.J. Brown. No. 2 behind DeVonta Smith.
      Rookie + new role = big variance. FanDuel may overprice.
      UNDER on receiving props until proven.
    props_affected:
      - receiving_yards: under

  # QBs on new teams
  - player: "Kyler Murray"
    new_team: MIN
    old_team: ARI
    position: QB
    notes: |
      O'Connell system (rhythm throws, play-action). Justin Jefferson is elite target.
      But new system = timing adjustment. Rushing props may be safer.
      Pass yards UNDER weeks 1-3. Rush props could be OVER.
    props_affected:
      - passing_yards: under_early
      - rushing_yards: over

  - player: "Malik Willis"
    new_team: MIA
    old_team: GB
    position: QB
    notes: |
      Very limited NFL starts. Dual-threat but raw passer.
      Only 4 appearances last season. 85.7% completion (tiny sample).
      HEAVY UNDER on passing yards/TDs. Rush yards may go over.
    props_affected:
      - passing_yards: strong_under
      - passing_tds: strong_under
      - rushing_yards: over

  - player: "Geno Smith"
    new_team: NYJ
    old_team: LV
    position: QB
    notes: |
      17 INTs last season (league high). Decision-making issues.
      Better weapons in NYJ (Garrett Wilson, Cooper Jr., Sadiq).
      Still: INT props OVER. Pass TD props UNDER.
    props_affected:
      - passing_tds: under
      - interceptions: over

  - player: "Kirk Cousins"
    new_team: LV
    old_team: ATL
    position: QB
    notes: |
      Familiar with Kubiak's system (worked together in MIN).
      Less new-team penalty than others. Steady floor.
      Exception to the new-team UNDER rule.
    props_affected:
      - passing_yards: neutral

  # RBs on new teams
  - player: "Kenneth Walker III"
    new_team: KC
    old_team: SEA
    position: RB
    notes: |
      Andy Reid system. 33 rushes of 10+ yards in 2025 (6th most).
      Chiefs averaged 4.2 YPC last year (bottom half). Clear upgrade.
      Rush yards could be OVER once established. Weeks 3+ target.
    props_affected:
      - rushing_yards: over_mid_season

  - player: "Jeremiyah Love"
    new_team: ARI
    old_team: "Rookie (Notre Dame)"
    position: RB
    notes: |
      21 TDs in final college season. 3-down back.
      Compared to Jahmyr Gibbs. Hardest schedule in NFL (#32).
      HARDEST SCHEDULE = props suppressed. UNDER lean.
    props_affected:
      - rushing_yards: under
      - anytime_td: under

  # TEs (breakout candidates)
  - player: "Isaiah Likely"
    new_team: NYG
    old_team: BAL
    position: TE
    notes: |
      "Breakout candidate" per ESPN. Was behind Mark Andrews.
      Giants new QB (Jaxson Dart) - both are new.
      Our finding: TEs most exploitable position (53% profitable).
      New team penalty still applies. UNDER weeks 1-3, then reassess.
    props_affected:
      - receiving_yards: under_early
      - receptions: under_early

# Game-level notes for Week 1 strategy
week_1_strategy:
  notes: |
    CONFIRMED FINDING: Week 1 ALL UNDER hits at 63.8% (3/3 seasons).
    Pass TDs UNDER: 75.8%. Pass yards UNDER: 70.6%.
    This is our single biggest edge of the entire season.
    
    ADDITIONAL 2026 CONTEXT: 
    - 10+ significant new QB/WR combinations
    - More team changes than usual = even MORE Week 1 under value
    - Target players on new teams ESPECIALLY hard
    
    BET SIZING: 2-3 units on each Week 1 under play (max confidence).


# ============================================================
# KEY INJURIES TO MONITOR (impact on Week 1+ prop lines)
# ============================================================
injuries_watch:
  # These players' availability changes how we bet their games
  high_impact:
    - player: "Dak Prescott"
      team: DAL
      position: QB
      injury: "Season-ending hamstring (2025). Return timeline uncertain."
      prop_impact: |
        If OUT: Cooper Rush starts. Dallas passing game = heavy UNDER.
        If IN: Likely limited early. Pass yards UNDER lean Week 1-3.

    - player: "A.J. Brown"
      team: NE
      position: WR
      injury: "Knee scope Feb 2026. Expected full camp."
      prop_impact: |
        New team (NE) + recovering from knee. Double UNDER signal early.
        If limited in camp: even stronger UNDER Week 1.

    - player: "Nick Chubb"
      team: CLE
      position: RB
      injury: "Returned late 2025 from major knee injury. Workload management."
      prop_impact: |
        Line may be set conservatively. If back to full health = OVER candidate.
        Monitor snap count reports closely.

    - player: "Chris Godwin"
      team: TB
      position: WR
      injury: "Dislocated ankle (Oct 2025). Long recovery."
      prop_impact: |
        If active: Lines will be low. Could be OVER if healthy.
        If OUT: Evans/Otton see boost. Adjust receiving prop targets.

    - player: "Joe Burrow"
      team: CIN
      position: QB
      injury: "Wrist surgery (2025). Said to be throwing well."
      prop_impact: |
        If healthy: CIN offense has easiest schedule (#2). OVER candidate.
        Monitor velocity reports from camp.

  medium_impact:
    - player: "Davante Adams"
      team: NYJ
      position: WR
      injury: "Age (33) + various soft tissue issues 2025."
      prop_impact: "If limited: reduces Jets passing ceiling. Garrett Wilson becomes primary."

    - player: "Jonathan Taylor"
      team: IND
      position: RB
      injury: "Ankle issues 2025. Age 27."
      prop_impact: "If healthy: workload should be high. Monitor camp reports."

    - player: "Puka Nacua"
      team: LAR
      position: WR
      injury: "Knee scope offseason. Expected full."
      prop_impact: "Elite WR2. If fully healthy = reception OVER candidate."

# ============================================================
# BREAKOUT CANDIDATES (Over lean mid/late season)
# ============================================================
# Players likely to exceed their FanDuel prop lines after settling in
breakout_candidates:
  - player: "Brock Bowers"
    team: LV
    position: TE
    notes: |
      Historic rookie year (112 receptions). Cousins should lean on him heavily.
      TE + contract year (Tier 2). Reception props OVER all season.
    confidence: HIGH

  - player: "Keon Coleman"
    team: BUF
    position: WR
    notes: |
      Sophomore year. Josh Allen's new WR1 with DJ Moore as WR2.
      Physical freak, 6'4". Deep threat + red zone. TD props interesting.
    confidence: MEDIUM

  - player: "Ladd McConkey"
    team: LAC
    position: WR
    notes: |
      Year 2 + McDaniel as OC. Could explode in this new system.
      Herbert + McDaniel scheme = target monster potential.
    confidence: HIGH

  - player: "Jaxon Smith-Njigba"
    team: SEA
    position: WR
    notes: |
      Year 3 breakout. DK Metcalf aged/injured. JSN becomes alpha.
      High-floor slot type. Receptions OVER lean.
    confidence: MEDIUM

  - player: "Jayden Daniels"
    team: WAS
    position: QB
    notes: |
      Year 2 QB. Rushing props remain strong despite 2025 struggles.
      Pass props caution (new OC, first-time play-caller).
    confidence: MEDIUM (rush only)

  - player: "Marvin Harrison Jr."
    team: ARI
    position: WR
    notes: |
      Year 2. Kyler traded to MIN — who is QBing now? Check.
      If new QB is limited: receiving UNDER. If competent: OVER.
    confidence: UNCERTAIN (QB-dependent)

  - player: "Ray Davis"
    team: BUF
    position: RB
    notes: |
      Year 2 behind James Cook. If Cook slows/injured: immediate RB1.
      Monitor camp battle. If split: both UNDER on high lines.
    confidence: LOW (situational)

# ============================================================
# DOME TEAMS (crucial for our dome strategies)
# ============================================================
dome_teams:
  full_dome:
    - ATL  # Mercedes-Benz Stadium
    - DAL  # AT&T Stadium
    - DET  # Ford Field
    - HOU  # NRG Stadium
    - IND  # Lucas Oil Stadium
    - LV   # Allegiant Stadium
    - LAR  # SoFi Stadium
    - LAC  # SoFi Stadium
    - MIN  # U.S. Bank Stadium
    - NO   # Caesars Superdome
    - ARI  # State Farm Stadium (retractable, usually closed)
  notes: |
    11 dome teams. Each plays 8-9 home games + some away dome matchups.
    Dome games trigger: Pass TDs OVER, Diamond plays at plus money.
    Cross-reference with schedule to find dome-dome matchups (double signal).

# ============================================================
# DIVISION GAME MATCHUPS (key for division UNDER strategy)
# ============================================================
# Each team plays 6 division games per season
# Division games: Rec UNDER + outdoor + not early season = 57.4% hit rate
# Flag all divisional outdoor matchups after Week 4
division_structure:
  AFC_East: [BUF, MIA, NE, NYJ]
  AFC_North: [BAL, CIN, CLE, PIT]
  AFC_South: [HOU, IND, JAX, TEN]
  AFC_West: [DEN, KC, LAC, LV]
  NFC_East: [DAL, NYG, PHI, WAS]
  NFC_North: [CHI, DET, GB, MIN]
  NFC_South: [ATL, CAR, NO, TB]
  NFC_West: [ARI, LAR, SEA, SF]

# ============================================================
# CONSOLIDATED WEEK 1 BETTING BRIEF
# ============================================================
week_1_brief:
  overall_confidence: "MAXIMUM"
  total_edge_estimate: "+21.7% ROI across all unders"
  
  slam_plays:
    - "ALL passing TDs UNDER (75.8% historical hit rate)"
    - "ALL passing yards UNDER (70.6% hit rate)"
    - "ALL receptions UNDER (62.0% hit rate)"
    - "New team players: EXTRA units UNDER (A.J. Brown, DJ Moore, Waddle, Murray)"
    
  enhanced_2026_factors:
    - "7 teams have new head coaches (unprecedented turnover)"
    - "21 new offensive coordinators (65%+ of league)"
    - "Multiple first-time play-callers (BAL Doyle, WAS Blough, PHI Mannion)"
    - "10+ significant QB/WR combinations never played together"
    - "This is the MOST DISRUPTED offseason in recent memory"
    
  unit_sizing:
    pass_tds_under: "3 units (max)"
    pass_yards_under: "3 units"
    receptions_under: "2 units"
    new_team_players: "3 units"
    all_other_unders: "2 units"
    
  avoid:
    - "Any OVER bet Week 1 (we want zero exposure)"
    - "Dome game overs (normally good, but Week 1 under overrides)"
    - "Contract year OVER signals (Week 1 under is stronger than motivation)"

