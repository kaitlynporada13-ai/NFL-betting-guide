# Validate Streamlit Dashboard
# Triggered after pipeline runs, or manually
# Streamlit Community Cloud auto-deploys from repo — this just validates.

name: Validate Dashboard

on:
  workflow_run:
    workflows: ["Weekly NFL Pipeline"]
    types: [completed]

  workflow_dispatch:

jobs:
  validate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all dashboard pages compile
        run: |
          python -m py_compile dashboard/app.py
          for f in dashboard/pages/*.py; do
            python -m py_compile "$f"
            echo "  OK: $f"
          done
          echo "All dashboard pages compile successfully"
